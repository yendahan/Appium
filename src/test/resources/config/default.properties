# Lowest-precedence defaults. Override order (highest first):
#   -Dkey=value  >  ENV_VAR (key upper-cased, '.' -> '_')  >  devices/<device>.properties  >  env/<env>.properties  >  this file

appium.url=http://127.0.0.1:4723
platform.name=Android

# Timeouts (seconds)
wait.explicit.seconds=15
wait.poll.millis=250
session.newCommandTimeout.seconds=120

# Gestures
scroll.maxAttempts=8
swipe.defaultPercent=0.75

# Artifacts
artifacts.dir=target/artifacts

# App under test: supply via env/<env>.properties or -D / env vars. Intentionally empty here.
app.package=
app.activity=
app.path=
app.noReset=false
app.autoGrantPermissions=true

# Locator (see utils.LocatorParser) of an element that is visible once the app has launched.
app.landing.locator=
