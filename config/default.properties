# Lowest-precedence defaults. Override order (highest first):
#   --cfg key=value  >  ENV_VAR (key upper-cased, '.' -> '_')  >  devices/<device>.properties  >  env/<env>.properties  >  this file

appium.url=http://127.0.0.1:4723
platform.name=Android

# Timeouts (seconds)
wait.explicit.seconds=30
wait.poll.millis=250
session.newCommandTimeout.seconds=120

# Gestures
scroll.maxAttempts=8
swipe.defaultPercent=0.75

# Artifacts
artifacts.dir=artifacts

# App under test: supply via env/<env>.properties or --cfg / env vars. Intentionally empty here.
app.package=
app.activity=
app.path=
app.noReset=false
app.autoGrantPermissions=true

# Locator (see utils.LocatorParser) of an element that is visible once the app has launched.
app.landing.locator=

# Zephyr Scale (optional). Set ZEPHYR_TOKEN in the environment to enable; never put the token in a file.
zephyr.project.key=AMW
# zephyr.base.url=https://api.zephyrscale.smartbear.com/v2

# Required for every Zephyr run (env ZEPHYR_CYCLE_NAME): each run creates a new cycle named "<name> <date time>".
# The run stops before any test if it is missing. (There is no cycle-key setting: a cycle is never reused.)
# zephyr.cycle.name=Regression

# Required for every Zephyr run (env ZEPHYR_CASES_FOLDER): the top test-case folder for the run, any name you choose
# (or a "parent/child" path). The project's test folders under tests/ (Android/Upgraded Consumer Account) are created
# inside it if missing, with any case defined in framework/zephyr_cases.py that they lack. Tests report only to
# the cases of those folders. The run stops before any test if this is missing.
# zephyr.cases.folder=Regression

# Link to the shared (OneDrive/SharePoint) folder holding the screenshots; shown in the step actual result.
# Set per run with env ZEPHYR_ARTIFACTS_LINK (the URL is organisation-private, do not commit it).
# zephyr.artifacts.link=
