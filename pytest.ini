[pytest]
testpaths = tests
addopts = -m unit
markers =
    unit: device-free tests (default)
    device: needs Appium on :4723 and an emulator/device (run with -m device)
    risky: moves real money or can lock accounts; select explicitly with -m "device and risky"
    zephyr(case_key): links a test to a Zephyr Scale test case
