[pytest]
testpaths = tests
addopts = -m unit
markers =
    unit: device-free tests (default)
    device: needs Appium on :4723 and an emulator/device (run with -m device)
    risky: moves real money or can lock accounts; select explicitly with -m "device and risky"
    shared_session(credentials_key): browse-only or Send Money test that may share one logged-in app session with --reuse-app
    zephyr: reports the test to its case (defined in framework/zephyr_cases.py) in the run's Zephyr cycle
filterwarnings =
    ignore:urllib3 v2 only supports OpenSSL:Warning
